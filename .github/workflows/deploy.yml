# Baut die Website bei jedem Push auf main (Build + SEO-Check) und rollt sie auf den Trizoun-Server aus.
# Zurückrollen: «Run workflow» mit dem Commit-Hash einer früheren Version als tag.
# Secrets: DEPLOY_HOST, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS.
# Variablen: PUBLIC_TRIZOUN_API_URL, PUBLIC_TRIZOUN_KEY (Publishable Key, öffentlich; leer = Mail-Anfrage).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Commit-Hash einer früheren Version (leer = aktueller Stand von main neu bauen)
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-website
  cancel-in-progress: false

env:
  SITE: alpine-siesta
  IMAGE: ghcr.io/romanzoun/alpine-siesta-web

jobs:
  bauen:
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            PUBLIC_TRIZOUN_API_URL=${{ vars.PUBLIC_TRIZOUN_API_URL }}
            PUBLIC_TRIZOUN_KEY=${{ vars.PUBLIC_TRIZOUN_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ausrollen:
    needs: bauen
    if: always() && (needs.bauen.result == 'success' || inputs.tag != '')
    runs-on: ubuntu-latest
    environment: production
    env:
      TAG: ${{ inputs.tag || github.sha }}
      ZIEL: /srv/sites/alpine-siesta
    steps:
      - uses: actions/checkout@v4
      - name: SSH vorbereiten
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Dateien auf den Server
        run: |
          ssh deploy@${{ secrets.DEPLOY_HOST }} "mkdir -p $ZIEL"
          scp deploy/compose.yml site/server.caddy deploy@${{ secrets.DEPLOY_HOST }}:$ZIEL/
      - name: Anmelden bei der Registry (Token gilt nur für diesen Lauf)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | ssh deploy@${{ secrets.DEPLOY_HOST }} "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
      - name: Starten
        run: |
          ssh deploy@${{ secrets.DEPLOY_HOST }} "
            set -e
            cd $ZIEL
            export SITE='$SITE' IMAGE='$IMAGE' TAG='$TAG'
            docker compose -p $SITE pull --quiet || { docker logout ghcr.io; exit 1; }
            docker logout ghcr.io
            docker compose -p $SITE up -d --wait
            docker compose -f /srv/trizoun/compose.yml --project-directory /srv/trizoun exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            docker image prune -f
          "
      - name: Prüfen
        run: |
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null https://alpine-siesta.ch/ && exit 0
            sleep 5
          done
          exit 1
