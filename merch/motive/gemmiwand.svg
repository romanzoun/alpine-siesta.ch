<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <!-- T-Shirt Front: Gemmiwand als Linienzeichnung über «Leukerbad» -->
  <style>
    @font-face { font-family: "Archivo"; src: url("../fonts/archivo-wdth.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
    svg { --ink: #f5f8f7; --akzent: #f0b38c; --zweit: #5cc8c2; }
    svg.dunkel { --ink: #16233a; --akzent: #d9825a; --zweit: #0f7470; }
    .t { font-family: "Archivo"; font-stretch: 62%; font-weight: 800; fill: var(--ink); }
    .k { font-family: "Archivo"; font-stretch: 100%; font-weight: 500; fill: var(--ink); }
  </style>
  <g fill="none" style="stroke: var(--ink)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <!-- Daubenhorn links, dann der lange Grat der Gemmiwand mit steilen Flanken -->
    <path d="M80 800 L160 760 L215 650 L260 520 L300 390 L335 270 L370 330 L410 300 L455 390 L540 365 L615 395 L700 352 L790 380 L880 345 L965 372 L1030 410 L1065 520 L1100 660 L1150 800" />
    <!-- Kalkbänder folgen dem Grat -->
    <path d="M270 500 Q480 470 700 480 T1060 505" stroke-width="5" opacity=".65" />
    <path d="M235 590 Q470 560 700 572 T1085 598" stroke-width="5" opacity=".65" />
    <path d="M200 680 Q460 650 700 664 T1105 690" stroke-width="5" opacity=".65" />
    <!-- Geröllhalden am Fuss -->
    <path d="M160 760 Q260 735 330 760 M880 760 Q990 730 1100 760" stroke-width="5" opacity=".65" />
  </g>
  <!-- Abendlicht auf dem Grat -->
  <path d="M335 270 L370 330 L410 300 L455 390 L540 365 L615 395 L700 352 L790 380 L880 345 L965 372 L1030 410" fill="none" style="stroke: var(--akzent)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" transform="translate(0,-24)" />
  <!-- Thermaldampf -->
  <g fill="none" style="stroke: var(--zweit)" stroke-width="9" stroke-linecap="round">
    <path d="M520 1000 q-26 -40 0 -80 q26 -40 0 -80" />
    <path d="M600 1020 q-26 -40 0 -80 q26 -40 0 -80 q26 -40 0 -80" />
    <path d="M680 1000 q-26 -40 0 -80 q26 -40 0 -80" />
  </g>
  <text class="t" x="600" y="1330" text-anchor="middle" font-size="330" letter-spacing="-4">Leukerbad</text>
  <text class="k" x="600" y="1440" text-anchor="middle" font-size="58" letter-spacing="6">1411 m über Meer, Wallis</text>
</svg>
